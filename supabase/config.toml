# Configuração para desenvolvimento local com Supabase CLI (`supabase start`).
project_id = "cardapio-digital"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
# Funcionários são criados pelo administrador; cadastro público desativado.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false
